<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b0e14">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>منصة الرياضيات - السادس العلمي</title>
    <style>
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0e14; z-index: 9999;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            color: #d4af37;
        }
        .login-banner { max-width: 300px; width: 90%; margin-bottom: 25px; border-radius: 10px; border: 2px solid #d4af37; }
        body { font-family: sans-serif; background: #0b0e14; color: #ffffff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        h1 { text-align: center; color: #d4af37; border-bottom: 2px solid #d4af37; padding-bottom: 10px; }

        /* ===== الأقسام المستطيلة ===== */
        .section-box {
            background: #12151c; border: 2px solid #d4af37; border-radius: 16px;
            padding: 18px; margin-bottom: 25px;
        }
        .section-box h2 { color: #d4af37; margin: 0 0 15px 0; display: flex; align-items: center; gap: 8px; }

        #videos, #homework { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
        .card { background: #1c202d; padding: 12px; border-radius: 10px; border: 1px solid #d4af37; text-align: center; }
        .card img { width: 100%; border-radius: 8px; margin-top: 8px; }
        input { padding: 10px; width: 200px; margin: 8px; border-radius: 5px; border: 1px solid #d4af37; background: #1c202d; color: white; }
        button { padding: 10px 20px; background: #d4af37; border: none; border-radius: 5px; cursor: pointer; color: black; font-weight: bold; }

        .video-box {
            position: relative; width: 100%; height: 180px; cursor: pointer;
            margin-top: 8px; border: 2px solid #d4af37; border-radius: 10px; overflow: hidden;
        }
        .video-shield-top { position: absolute; top: 0; left: 0; width: 100%; height: 55px; background: rgba(0,0,0,0); z-index: 10; pointer-events: auto; }
        .video-shield-bottom-left { position: absolute; bottom: 0; left: 0; width: 120px; height: 45px; background: rgba(0,0,0,0); z-index: 10; pointer-events: auto; }

        /* ===== السبورة ===== */
        .board-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .board-toolbar select, .board-toolbar button { margin: 0; padding: 8px 12px; font-size: 13px; }
        .board-toolbar button.active { outline: 3px solid #fff; }
        #board-wrapper { overflow: auto; border: 2px solid #d4af37; border-radius: 10px; background: #fff; max-height: 60vh; touch-action: none; }
        #board-canvas { display: block; background: #fff; touch-action: none; }
        .board-sub { font-size: 12px; color: #999; margin: 6px 0; }

        /* ===== زر ونافذة الاستفسار ===== */
        #inquiry-btn { position: fixed; top: 15px; left: 15px; z-index: 500; border-radius: 50px; padding: 10px 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
        #inquiry-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; display: none; justify-content: center; align-items: center; }
        #inquiry-box { background: #1c202d; border: 2px solid #d4af37; border-radius: 12px; padding: 18px; max-width: 420px; width: 92%; }
        #inquiry-box h2 { margin-top: 0; text-align: center; }
        #inquiry-close-top { position: absolute; top: 10px; left: 10px; background: transparent; color: #d4af37; border: 1px solid #d4af37; padding: 4px 10px; }
        #inquiry-messages { background: #0b0e14; border: 1px solid #333; border-radius: 10px; padding: 10px; height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .bubble { position: relative; max-width: 78%; padding: 9px 13px; border-radius: 14px; line-height: 1.6; font-size: 14px; }
        .bubble.teacher { background: #2a2f3d; color: #fff; margin-right: auto; border-bottom-right-radius: 3px; }
        .bubble.student { background: #d4af37; color: #0b0e14; margin-left: auto; border-bottom-left-radius: 3px; }
        .bubble .msg-time { display: block; font-size: 10px; opacity: 0.65; margin-top: 4px; }
        #inquiry-input-row { display: flex; gap: 8px; position: relative; }
        #inquiry-input-row input { flex: 1; margin: 0; width: auto; }
        #inquiry-input-row button { margin: 0; }

        /* ===== الشاشة الرئيسية (القائمة) ===== */
        .menu-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; margin-top: 20px;
        }
        .menu-card {
            background: #12151c; border: 2px solid #d4af37; border-radius: 16px;
            padding: 30px 15px; text-align: center; cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .menu-card:hover { transform: translateY(-4px); background: #1c202d; }
        .menu-icon { font-size: 42px; margin-bottom: 10px; }
        .menu-title { font-size: 18px; color: #d4af37; font-weight: bold; }

        /* ===== الشاشات الكاملة (كل قسم يملأ الشاشة) ===== */
        .fullscreen-section {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0e14; z-index: 800;
            overflow-y: auto; padding: 20px; box-sizing: border-box;
        }
        .fullscreen-section.active { display: block; }
        .fullscreen-inner { max-width: 900px; margin: auto; }
        .back-btn { margin-bottom: 15px; }
    </style>
</head>

<body>

    <div id="login-screen">
        <img src="login-banner.png" class="login-banner" alt="إعلان الدورة">
        <h1>🔐 دخول الطالب</h1>
        <input type="text" id="name-input" placeholder="اسمك الكامل">
        <input type="text" id="code-input" placeholder="أدخل الكود">
        <button onclick="checkCode()">دخول</button>
    </div>

    <button id="inquiry-btn" onclick="openInquiry()" style="display:none;">❓ استفسار</button>

    <div id="inquiry-panel">
        <div id="inquiry-box" style="position:relative;">
            <button id="inquiry-close-top" onclick="closeInquiry()">✕ إغلاق</button>
            <h2>✉️ محادثتك مع الأستاذ</h2>
            <div id="inquiry-messages">جاري التحميل...</div>
            <div id="inquiry-input-row">
                <input type="text" id="inquiry-text" placeholder="اكتب رسالتك...">
                <button onclick="sendInquiry()">إرسال</button>
            </div>
        </div>
    </div>

    <div class="container" id="main-content" style="display: none;">
        <h1>📚 دورة الرياضيات</h1>

        <!-- ===== الشاشة الرئيسية ===== -->
        <div id="home-screen">
            <div class="menu-grid">
                <div class="menu-card" onclick="showScreen('videos')">
                    <div class="menu-icon">🎬</div>
                    <div class="menu-title">فيديوهاتي</div>
                </div>
                <div class="menu-card" onclick="showScreen('homework')">
                    <div class="menu-icon">📚</div>
                    <div class="menu-title">واجباتي</div>
                </div>
                <div class="menu-card" onclick="showScreen('board')">
                    <div class="menu-icon">🖊️</div>
                    <div class="menu-title">السبورة الذكية</div>
                </div>
            </div>
        </div>

        <!-- ===== شاشة الفيديوهات (ملء الشاشة) ===== -->
        <div id="screen-videos" class="fullscreen-section">
            <div class="fullscreen-inner">
                <button class="back-btn" onclick="showScreen('home')">➡️ رجوع</button>
                <h1>🎬 فيديوهاتي</h1>
                <div id="videos">جاري تحميل الفيديوهات...</div>
            </div>
        </div>

        <!-- ===== شاشة الواجبات (ملء الشاشة) ===== -->
        <div id="screen-homework" class="fullscreen-section">
            <div class="fullscreen-inner">
                <button class="back-btn" onclick="showScreen('home')">➡️ رجوع</button>
                <h1>📚 واجباتي</h1>
                <div id="homework">جاري تحميل الواجبات...</div>
            </div>
        </div>

        <!-- ===== شاشة السبورة الذكية (ملء الشاشة) ===== -->
        <div id="screen-board" class="fullscreen-section">
            <div class="fullscreen-inner">
                <button class="back-btn" onclick="showScreen('home')">➡️ رجوع</button>
                <h1>🖊️ السبورة الذكية</h1>
                <div class="board-toolbar">
                    <select id="board-bg" onchange="loadBoardBackground()">
                        <option value="">سبورة فارغة</option>
                    </select>
                    <button id="mode-pen" onclick="setBoardMode('pen')">✍️ قلم (كتابة يد)</button>
                    <button id="mode-text" onclick="setBoardMode('text')">⌨️ نص (كيبورد)</button>
                    <button id="mode-eraser" onclick="setBoardMode('eraser')">🧹 ممحاة</button>
                    <button onclick="zoomBoard(1.15)">🔍 تكبير</button>
                    <button onclick="zoomBoard(0.87)">🔍 تصغير</button>
                    <button onclick="fontStep(2)">🔠 تكبير الخط</button>
                    <button onclick="fontStep(-2)">🔡 تصغير الخط</button>
                    <button onclick="clearBoard()">🗑️ مسح الكل</button>
                </div>
                <div class="board-sub">الوضع الحالي: <span id="mode-label">✍️ قلم</span> — حجم الخط: <span id="font-label">22</span></div>
                <div id="board-wrapper">
                    <canvas id="board-canvas" width="800" height="600"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getFirestore, collection, getDocs, addDoc, orderBy, query, serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAnrA51VP7E9uH2e567EDRNml4Hy_tdj2A",
            authDomain: "math-ed7aa.firebaseapp.com",
            projectId: "math-ed7aa",
            storageBucket: "math-ed7aa.firebasestorage.app",
            messagingSenderId: "104137767322",
            appId: "1:104137767322:web:6b65acadecaf96701ce223"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentStudentCode = null;
        let currentStudentName = null;
        let homeworkCache = [];

        // ============================================================
        // تسجيل الدخول التلقائي إذا كان محفوظاً على هذا الجهاز
        // ============================================================
        (function autoLogin() {
            const savedLoggedIn = localStorage.getItem("isLoggedIn");
            const savedName = localStorage.getItem("studentName");
            const savedCode = localStorage.getItem("loggedInCode");
            if (savedLoggedIn === "true" && savedName && savedCode) {
                enterSite(savedCode, savedName);
            }
        })();

        // ============================================================
        // التنقل بين الشاشات (رئيسية / فيديوهات / واجبات / سبورة)
        // ============================================================
        window.showScreen = function (name) {
            document.getElementById('home-screen').style.display = (name === 'home') ? 'block' : 'none';
            ['videos', 'homework', 'board'].forEach(key => {
                document.getElementById('screen-' + key).classList.toggle('active', name === key);
            });
            window.scrollTo(0, 0);
        };

        window.loadVideo = function (element, url) {
            element.innerHTML = `
                <div class="video-shield-top"></div>
                <div class="video-shield-bottom-left"></div>
                <iframe src="${url}" width="100%" height="100%" frameborder="0"
                    style="position:relative; z-index:1;"
                    allowfullscreen="true" webkitallowfullscreen="true"
                    mozallowfullscreen="true" playsinline="true" webkit-playsinline="true"></iframe>
            `;
        };

        const validCodes = [
            "12543", "83920", "47105", "92837", "10293",
            "56473", "28374", "91028", "37465", "82910",
            "47362", "59281", "10394", "67482", "29384",
            "83746", "51627", "49382", "92019", "74653"
        ];

        window.checkCode = function () {
            const name = document.getElementById("name-input").value.trim();
            const input = document.getElementById("code-input").value;

            if (!name) { alert("الرجاء إدخال اسمك"); return; }

            if (validCodes.includes(input)) {
                const savedDevice = localStorage.getItem("device_" + input);
                const currentDevice = navigator.userAgent;

                if (!savedDevice) {
                    localStorage.setItem("device_" + input, currentDevice);
                    localStorage.setItem("isLoggedIn", "true");
                    localStorage.setItem("studentName", name);
                    localStorage.setItem("loggedInCode", input);
                    alert("تم تفعيل الكود على هذا الجهاز بنجاح!");
                    enterSite(input, name);
                } else if (savedDevice === currentDevice) {
                    localStorage.setItem("isLoggedIn", "true");
                    localStorage.setItem("studentName", name);
                    localStorage.setItem("loggedInCode", input);
                    enterSite(input, name);
                } else {
                    alert("عذراً، هذا الكود مفعل بالفعل على جهاز آخر ولا يمكن استخدامه هنا.");
                }
            } else {
                alert("كود خاطئ!");
            }
        };

        function enterSite(code, name) {
            currentStudentCode = code;
            currentStudentName = name;
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("main-content").style.display = "block";
            document.getElementById("inquiry-btn").style.display = "block";
            showScreen('home');
            loadVideosFromServer();
            loadHomeworkFromServer();
        }

        async function loadVideosFromServer() {
            const container = document.getElementById("videos");
            container.innerHTML = "جاري تحميل الفيديوهات...";
            try {
                const q = query(collection(db, "videos"), orderBy("createdAt", "desc"));
                const snap = await getDocs(q);
                if (snap.empty) { container.innerHTML = "<p>لا يوجد فيديوهات منشورة حالياً.</p>"; return; }
                container.innerHTML = "";
                snap.forEach(docSnap => {
                    const video = docSnap.data();
                    container.innerHTML += `
                    <div class="card">
                        <h3>${video.title}</h3>
                        <div class="video-box" style="padding:0; overflow:hidden;" onclick="loadVideo(this, '${video.url}')">
                            <div style="display:flex; align-items:center; justify-content:center; height:100%; color:#d4af37;">▶️ اضغط للتشغيل</div>
                        </div>
                    </div>`;
                });
            } catch (err) { container.innerHTML = "<p style='color:red;'>تعذر تحميل الفيديوهات: " + err.message + "</p>"; }
        }

        async function loadHomeworkFromServer() {
            const container = document.getElementById("homework");
            const select = document.getElementById("board-bg");
            container.innerHTML = "جاري تحميل الواجبات...";
            try {
                const q = query(collection(db, "homework"), orderBy("createdAt", "desc"));
                const snap = await getDocs(q);
                homeworkCache = [];
                select.innerHTML = '<option value="">سبورة فارغة</option>';
                if (snap.empty) { container.innerHTML = "<p>لا يوجد واجبات حالياً.</p>"; return; }
                container.innerHTML = "";
                snap.forEach(docSnap => {
                    const hw = docSnap.data();
                    homeworkCache.push({ id: docSnap.id, title: hw.title, image: hw.image });
                    container.innerHTML += `<div class="card"><h3>${hw.title}</h3><img src="${hw.image}" alt=""></div>`;
                    const opt = document.createElement('option');
                    opt.value = docSnap.id;
                    opt.textContent = hw.title;
                    select.appendChild(opt);
                });
            } catch (err) { container.innerHTML = "<p style='color:red;'>تعذر تحميل الواجبات: " + err.message + "</p>"; }
        }

        // ============================================================
        // السبورة الذكية
        // ============================================================
        const canvas = document.getElementById('board-canvas');
        const ctx = canvas.getContext('2d');
        let boardMode = 'pen';
        let fontSize = 22;
        let drawing = false;
        let lastX = 0, lastY = 0;
        let zoomLevel = 1;

        function fillWhite() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        fillWhite();

        window.setBoardMode = function (mode) {
            boardMode = mode;
            document.getElementById('mode-label').textContent =
                mode === 'pen' ? '✍️ قلم' : mode === 'text' ? '⌨️ نص' : '🧹 ممحاة';
            ['mode-pen', 'mode-text', 'mode-eraser'].forEach(id => document.getElementById(id).classList.remove('active'));
            document.getElementById('mode-' + mode).classList.add('active');
        };
        setBoardMode('pen');

        window.fontStep = function (delta) {
            fontSize = Math.max(10, Math.min(60, fontSize + delta));
            document.getElementById('font-label').textContent = fontSize;
        };

        window.zoomBoard = function (factor) {
            zoomLevel = Math.max(0.5, Math.min(3, zoomLevel * factor));
            canvas.style.transform = `scale(${zoomLevel})`;
            canvas.style.transformOrigin = 'top right';
        };

        window.clearBoard = function () {
            if (!confirm('مسح كل ما هو مكتوب على السبورة؟')) return;
            fillWhite();
            const bgId = document.getElementById('board-bg').value;
            if (bgId) drawBackgroundImage(bgId);
        };

        function drawBackgroundImage(id) {
            const hw = homeworkCache.find(h => h.id === id);
            if (!hw) return;
            const img = new Image();
            img.onload = () => {
                fillWhite();
                const ratio = Math.min(canvas.width / img.width, canvas.height / img.height);
                const w = img.width * ratio, h = img.height * ratio;
                const x = (canvas.width - w) / 2, y = (canvas.height - h) / 2;
                ctx.drawImage(img, x, y, w, h);
            };
            img.src = hw.image;
        }

        window.loadBoardBackground = function () {
            const bgId = document.getElementById('board-bg').value;
            fillWhite();
            if (bgId) drawBackgroundImage(bgId);
        };

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function startDraw(e) {
            if (boardMode === 'text') {
                const pos = getPos(e);
                const text = prompt('اكتب النص:');
                if (text) {
                    ctx.fillStyle = '#000000';
                    ctx.font = fontSize + 'px sans-serif';
                    ctx.textBaseline = 'top';
                    ctx.fillText(text, pos.x, pos.y);
                }
                return;
            }
            drawing = true;
            const pos = getPos(e);
            lastX = pos.x; lastY = pos.y;
            e.preventDefault();
        }

        function moveDraw(e) {
            if (!drawing || boardMode === 'text') return;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.lineCap = 'round';
            if (boardMode === 'eraser') {
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 24;
            } else {
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 3;
            }
            ctx.stroke();
            lastX = pos.x; lastY = pos.y;
            e.preventDefault();
        }

        function endDraw() { drawing = false; }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', moveDraw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mouseleave', endDraw);
        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', moveDraw, { passive: false });
        canvas.addEventListener('touchend', endDraw);

        // ============================================================
        // الاستفسار / المحادثة مع الأستاذ
        // ============================================================
        window.openInquiry = async function () {
            document.getElementById("inquiry-panel").style.display = "flex";
            await loadInquiryMessages();
        };
        window.closeInquiry = function () {
            document.getElementById("inquiry-panel").style.display = "none";
        };

        async function loadInquiryMessages() {
            const box = document.getElementById("inquiry-messages");
            box.innerHTML = "جاري التحميل...";
            try {
                const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
                const snap = await getDocs(q);
                box.innerHTML = "";
                let any = false;
                snap.forEach(docSnap => {
                    const m = docSnap.data();
                    if (m.studentCode !== currentStudentCode) return;
                    any = true;
                    const time = m.createdAt && m.createdAt.toDate ? m.createdAt.toDate().toLocaleString('ar') : '';
                    const bubble = document.createElement('div');
                    bubble.className = 'bubble ' + (m.sender === 'teacher' ? 'teacher' : 'student');
                    bubble.innerHTML = `${m.text}<span class="msg-time">${time}</span>`;
                    box.appendChild(bubble);
                });
                if (!any) box.innerHTML = '<p style="color:#999; text-align:center;">لا يوجد رسائل بعد، ابدأ محادثتك مع الأستاذ.</p>';
                box.scrollTop = box.scrollHeight;
            } catch (err) { box.innerHTML = '<p style="color:red;">تعذر التحميل: ' + err.message + '</p>'; }
        }

        window.sendInquiry = async function () {
            const input = document.getElementById("inquiry-text");
            const text = input.value.trim();
            if (!text) return;
            try {
                await addDoc(collection(db, "messages"), {
                    studentCode: currentStudentCode,
                    studentName: currentStudentName,
                    sender: 'student',
                    text,
                    createdAt: serverTimestamp()
                });
                input.value = '';
                loadInquiryMessages();
            } catch (err) { alert('خطأ بالإرسال: ' + err.message); }
        };
    </script>

    <script>
        // تسجيل الـ Service Worker لجعل الصفحة قابلة للتثبيت كتطبيق (PWA)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
